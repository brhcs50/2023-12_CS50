{% extends "layout.html" %}

{% block title %}
    Sell
{% endblock %}

{% block main %}
    <h1>Sell a Stock</h1>
    <form action="/sell" method="post">
        <div class="mb-3">
            <select class="form_control" id="symbol" name="symbol">
                <option value="">Choose a Stock</option>
                {% for stock in stocks %}
                    <option value="{{ stock.symbol }}">{{ stock.symbol }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control mx-auto w-auto" id="shares" name="shares" placeholder="Shares #" type="number">
        </div>
        <button class="btn btn-primary" type="submit">Click to Sell</button>
    </form>
{% endblock %}
