<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
        <link href="styles.css" rel="stylesheet">
        <title>My Webpage</title>

        <script>
            function setIframeSource() {
                var selection = document.getElementById('pagename');
                var myiframe = document.getElementById('iframe1');
                var targeturl;

                targeturl = selection.options[selection.selectedIndex].value;
                myiframe.src = targeturl;
            }
        </script>
    </head>
    <body>
        <div class="menutop">
            <a href="index.html">Home</a>
            <a href="pets.html">Pets</a>
            <a href="hobbies.html">Hobbies</a>
            <a href="contact.html">Contact</a>
        </div>

        <div class="main">
            <form id="form1" method="post">
                <select id="pagename" onchange="setIframeSource()"  class="center">
                    <option disabled selected>Select a Hobby</option>
                    <option value="cor.html">Corvette Repair</option>
                    <option value="ebay.html">eBay Business</option>
                    <option value="wow.html">World of Warcraft</option>
                </select>
            </form>
            <iframe id="iframe1" src="select.html" height="750" width="100%"></iframe>
        </div>
    </body>
</html>
